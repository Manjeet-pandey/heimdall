# sandbox + checkpoint
# Agents: no external route. Only checkpoint reaches the internet.
networks:
  agentnet:
    internal: true
  egress:
volumes:
  mitm-conf:  # CA private key — checkpoint only
  hf-cache:   # PromptGuard 2 weights
services:
  checkpoint:
    image: mitmproxy/mitmproxy:11
    # lazy: no upstream connect/DNS before the request hook decides. proxyauth username = agent name.
    # ponytail: single proxyauth user; switch to proxyauth=@htpasswd when the second agent image lands.
    command: >
      mitmdump -s /app/checkpoint/addon.py
      --set body_size_limit=1m
      --set connection_strategy=lazy
      --set proxyauth=coder:coder-pass
    working_dir: /app
    volumes:
      - ./checkpoint:/app/checkpoint:ro
      - ./reviewer:/app/reviewer:ro
      - ./data:/data
      - mitm-conf:/home/mitmproxy/.mitmproxy
    environment:
      - PYTHONPATH=/app
      - HEIMDALL_DB=/data/checkpoint.db
      - HEIMDALL_CA_OUT=/data/ca/mitmproxy-ca-cert.pem
      - HEIMDALL_DECIDER=${HEIMDALL_DECIDER:-wonder}  # who settles what Muse Spark is unsure about: wonder | human
      - HEIMDALL_GUARD_URL=${HEIMDALL_GUARD_URL:-http://guard:8002}  # GPU guard on a Mac: http://host.docker.internal:8002
      - HEIMDALL_POLICY=/data/policy.json  # live, written by the review page's lock
      - HEIMDALL_POLICY_SEED=/app/checkpoint/policy.json
    healthcheck:
      test: ["CMD", "test", "-f", "/data/ca/mitmproxy-ca-cert.pem"]
      interval: 2s
      retries: 15
    networks:
      - agentnet
      - egress
    ports:
      - "127.0.0.1:8080:8080"  # proxy
    env_file:
      - .env.secrets
  coder:
    image: python:3.12-slim
    command: sleep infinity
    user: "10000:10000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Own core + CPU cap: slows CPU-timing side channels to other agents. Next agent gets a different core.
    # ponytail: narrows the channel, doesn't close it; separate VMs per agent do (roadmap).
    cpuset: "${CODER_CPUSET:-0}"
    cpus: 1
    volumes:
      - ./agent-work/coder:/work:rw
      - ./notes:/notes:ro
      - ./data/ca:/certs:ro  # public CA cert only, published by the checkpoint
    environment:
      - HTTPS_PROXY=http://coder:coder-pass@checkpoint:8080
      - HTTP_PROXY=http://coder:coder-pass@checkpoint:8080
      - REQUESTS_CA_BUNDLE=/certs/mitmproxy-ca-cert.pem
      - SSL_CERT_FILE=/certs/mitmproxy-ca-cert.pem
      - NODE_EXTRA_CA_CERTS=/certs/mitmproxy-ca-cert.pem
    networks:
      - agentnet
    depends_on:
      checkpoint:
        condition: service_healthy
  guard:
    # PromptGuard 2 on CPU. One-time model download (gated: accept the license on Hugging Face first):
    #   HF_TOKEN=... docker compose run --rm -e HF_TOKEN -e HF_HUB_OFFLINE=0 guard python /app/guard.py --download
    build:
      context: ./reviewer
      dockerfile: guard.Dockerfile
    image: heimdall-guard
    command: python /app/guard.py
    user: "10000:10000"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./reviewer/guard.py:/app/guard.py:ro
      - hf-cache:/hf
    environment:
      - HF_HOME=/hf
      - HF_HUB_OFFLINE=1
      - PROMPTGUARD_MODEL=meta-llama/Llama-Prompt-Guard-2-86M
    networks:
      - egress  # checkpoint only; agents can't probe it to tune injections
  review:
    image: python:3.12-slim
    command: python /app/review/app.py
    user: "10000:10000"
    read_only: true
    working_dir: /app
    volumes:
      - ./review:/app/review:ro
      - ./checkpoint:/app/checkpoint:ro
      - ./data:/app/data  # writes only its decisions file and the live policy
      - ./proof/out:/app/proof/out:ro
    environment:
      - HEIMDALL_DB=/app/data/checkpoint.db
      - HEIMDALL_POLICY=/app/data/policy.json
      - REVIEW_BIND=0.0.0.0
      - REVIEW_RUNNER=0  # no docker in here; run `python3 review/app.py` on the host for the Run buttons
    ports:
      - "127.0.0.1:8000:8000"  # review page, localhost only: it has Allow/Lock buttons and no login
